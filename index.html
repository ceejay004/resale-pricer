<script>
async function calculate() {
  const item = document.getElementById("item").value;
  if (!item) return;

  document.getElementById("results").innerHTML =
    "<div class='card'>Checking real sold prices...</div>";

  const r = await fetch("/api/price?item=" + encodeURIComponent(item));
  const data = await r.json();

  if (data.error) {
    document.getElementById("results").innerHTML =
      "<div class='card'>No sold listings found</div>";
    return;
  }

  document.getElementById("results").innerHTML = `
    <div class="card"><div>Average Used (${data.samples} sales)</div><div class="price">£${data.average}</div></div>
    <div class="card"><div>Quick Sale</div><div class="price">£${data.quick}</div></div>
    <div class="card"><div>Normal Sale</div><div class="price">£${data.normal}</div></div>
    <div class="card"><div>Max Price</div><div class="price">£${data.max}</div></div>
  `;
}
